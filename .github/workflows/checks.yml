name: Core checks

on:
  pull_request:
  push:
    branches: [reconcile-experiments-suraj]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch for tiny decoder checks
        run: python -m pip install 'torch>=2.6,<2.11' --index-url https://download.pytorch.org/whl/cpu
      - name: Run regression checks without model downloads
        run: python -m unittest discover -s tests -v
